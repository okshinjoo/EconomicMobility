name: Scholarship monitor observation pilot

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholarship-monitor-observation-pilot
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the browser fallback
        run: npx playwright install --with-deps chromium

      - name: Validate monitor rules
        run: npm run check:scholarship-monitor-sources

      - name: Test fail-closed behavior
        run: npm run test:scholarship-monitor-worker

      - name: Record official-source observations
        run: npm run monitor:scholarships -- --write --browser-fallback

