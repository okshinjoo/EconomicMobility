name: Scholarship monitoring alerts

on:
  schedule:
    - cron: "11 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholarship-monitor-alerts
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test alert rules
        run: npm run test:scholarship-monitor-alerts

      - name: Audit monitoring state
        run: npm run check:scholarship-monitor-alerts
