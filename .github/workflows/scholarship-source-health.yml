name: Scholarship official-source health

on:
  schedule:
    - cron: "43 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scholarship-source-health
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Validate publication geography
        run: npm run check:scholarship-tags

      - name: Sync verified monitor inventory
        run: npm run seed:scholarship-monitor -- --write

  observe:
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install the browser fallback
        run: npx playwright install --with-deps chromium

      - name: Validate complete monitor coverage
        run: npm run check:scholarship-monitor-sources

      - name: Test fail-closed behavior
        run: npm run test:scholarship-monitor-worker

      - name: Record official-source health
        run: npm run monitor:scholarships -- --write --browser-fallback --summary-only --mode=source-health --shard-index=${{ matrix.shard }} --shard-count=8
